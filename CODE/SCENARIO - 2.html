
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Quiz</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .quiz {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        .option {
            display: block;
            padding: 10px;
            border: 1px solid #ddd;
            margin: 8px 0;
        }
        button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:disabled {
            background: gray;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="quiz">
    <h2>JavaScript Quiz</h2>

    <div id="quizBox">
        <p id="questionNumber"></p>
        <h4 id="question"></h4>

        <div id="options"></div>

        <button id="nextBtn" disabled onclick="nextQuestion()">
            Next
        </button>
    </div>

    <div id="result" style="display:none; text-align:center;">
        <h1 id="score"></h1>
        <p id="message"></p>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>

let questions = [
    {
        question: "Which keyword declares a constant variable?",
        options: ["var", "let", "const", "static"],
        answer: 2
    },
    {
        question: "Which language is used for web page interactivity?",
        options: ["HTML", "CSS", "JavaScript", "SQL"],
        answer: 2
    },
    {
        question: "Which symbol is used for comments in JavaScript?",
        options: ["//", "#", "<!--", "**"],
        answer: 0
    },
    {
        question: "Which method adds an element to an array?",
        options: ["pop()", "push()", "shift()", "slice()"],
        answer: 1
    }
];

let currentQuestion = 0;
let score = 0;

function showQuestion() {
    let q = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").innerHTML = q.question;

    let optionsHTML = "";

    for (let i = 0; i < q.options.length; i++) {
        optionsHTML += `
            <label class="option">
                <input type="radio" name="answer"
                value="${i}" onchange="enableNext()">
                ${q.options[i]}
            </label>
        `;
    }

    document.getElementById("options").innerHTML = optionsHTML;

    let btn = document.getElementById("nextBtn");
    btn.disabled = true;

    if (currentQuestion === questions.length - 1) {
        btn.innerHTML = "Finish";
    } else {
        btn.innerHTML = "Next";
    }
}

function enableNext() {
    document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
    let selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (selected === null) return;

    if (parseInt(selected.value) === questions[currentQuestion].answer) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("result").style.display = "block";

    let percentage = (score / questions.length) * 100;

    document.getElementById("score").innerHTML =
        score + " / " + questions.length;

    let message = "";

    if (percentage === 100) {
        message = "Excellent work!";
    }
    else if (percentage >= 50) {
        message = "Good job!";
    }
    else {
        message = "Keep practicing!";
    }

    document.getElementById("message").innerHTML =
        "You scored " + percentage + "%. " + message;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("quizBox").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
