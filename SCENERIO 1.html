
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        table {
            border-collapse: collapse;
            width: 600px;
        }
        th, td {
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Shopping Cart</h2>

<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody id="cart"></tbody>
</table>

<h3 id="subtotal"></h3>
<h3 id="discount"></h3>
<h3 id="amount"></h3>

<script>
let items = [
    {name: "Notebook", price: 120, qty: 1},
    {name: "Pen Pack", price: 60, qty: 1},
    {name: "Water Bottle", price: 350, qty: 1}
];

function displayCart() {
    let cart = document.getElementById("cart");
    cart.innerHTML = "";

    let subtotal = 0;

    for (let i = 0; i < items.length; i++) {
        let total = items[i].price * items[i].qty;
        subtotal += total;

        cart.innerHTML += `
        <tr>
            <td>${items[i].name}</td>
            <td>Rs. ${items[i].price}</td>
            <td>
                <button onclick="changeQty(${i}, -1)">-</button>
                ${items[i].qty}
                <button onclick="changeQty(${i}, 1)">+</button>
            </td>
            <td>Rs. ${total}</td>
            <td>
                <button onclick="removeItem(${i})">Remove</button>
            </td>
        </tr>`;
    }

    let discount = subtotal >= 1000 ? subtotal * 0.10 : 0;
    let amount = subtotal - discount;

    document.getElementById("subtotal").innerHTML =
        "Subtotal: Rs. " + subtotal;

    document.getElementById("discount").innerHTML =
        "Discount (10%): Rs. " + discount;

    document.getElementById("amount").innerHTML =
        "Amount Payable: Rs. " + amount;

    if (items.length === 0) {
        document.getElementById("cart").innerHTML =
            "<tr><td colspan='5'>Your cart is empty</td></tr>";
    }
}

function changeQty(index, value) {
    if (items[index].qty + value >= 1) {
        items[index].qty += value;
    }
    displayCart();
}

function removeItem(index) {
    items.splice(index, 1);
    displayCart();
}

displayCart();
</script>

</body>
</html>
